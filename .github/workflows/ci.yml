name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Guide source and highlighting
        run: node --test tests/guide/*.test.mjs
      - name: Deployment helpers
        run: python3 tests/deploy/helper_test.py
      - name: Validate config templates
        run: scripts/check-templates.sh
      - name: Dependency advisories, licenses and sources
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          rust-version: "1.98"
      - name: Parser mutation fuzzing
        env:
          KANATA_FUZZ_CASES: "20000"
        run: cargo test --locked -p kanata-server --lib parser_mutation_smoke
      - name: Container smoke test
        if: runner.os == 'Linux'
        run: deploy/scripts/container-smoke.sh
