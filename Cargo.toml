[package]
name = "kanata"
version = "1.0.0-beta.4"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "A lightweight inference gateway for local and remote AI runtimes"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "=0.22.1"
bytes = "1.12.1"
futures-core = "0.3"
futures-util = "=0.3.32"
getrandom = "=0.4.3"
http = "1.5"
http-body = "1.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "rustls-platform-verifier"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "service", "tokio"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }
multer = "3.1"
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
tower = { version = "0.5", features = ["util"] }
url = "2"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
