# Opt-in public ingress: api hostname -> owner-managed Cloudflare tunnel ->
# Kanata's public listener. Requires [listeners.public] bind = "172.29.0.2".
#   docker compose -f compose.kanata.yml -f compose.kanata.public.yml ...
# Nothing is host-published; cloudflared never joins the private network.
services:
  kanata:
    networks:
      public_origin:
        ipv4_address: 172.29.0.2

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    pull_policy: missing
    entrypoint: ["cloudflared", "--no-autoupdate"]
    # Metrics stay on container loopback; debug logging would record headers.
    command:
      - tunnel
      - --loglevel
      - info
      - --metrics
      - 127.0.0.1:20241
      - run
      - --token-file
      - /run/secrets/cloudflared-tunnel-token
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - kanata
    secrets:
      - source: cloudflared_tunnel_token
        target: cloudflared-tunnel-token
    networks:
      public_origin:
        ipv4_address: 172.29.0.3
      tunnel_egress:
        gw_priority: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  cloudflared_tunnel_token:
    file: "${KANATA_CLOUDFLARED_TOKEN_FILE:?Set KANATA_CLOUDFLARED_TOKEN_FILE to the tunnel token file}"

networks:
  public_origin:
    # Fixed name; only Kanata's public listener and cloudflared attach.
    name: kanata_public_origin
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  tunnel_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
