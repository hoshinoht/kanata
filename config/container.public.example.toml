# Private + public container template: use with deploy/compose/compose.kanata.public.yml.
# kanata-api hostname -> owner-managed Cloudflare tunnel -> public listener on
# the internal kanata_public_origin network. Nothing is host-published.
[listeners.client]
bind = "172.30.0.2"
port = 8080

# Reached only by cloudflared; missing/invalid keys get 403 on every path.
[listeners.public]
bind = "172.29.0.2"
port = 8081

[listeners.admin]
bind = "127.0.0.1"
port = 9090

[publication]
# Host tailnet IPv4 for the private route; must match the edge's EDGE_TAILNET_IPV4.
tailnet_addresses = ["100.64.0.10"]
# Exact alias/operation pairs reachable publicly. Empty by default; private-only
# providers (ChatGPT, CLIProxyAPI, Anthropic) are always rejected.
# Example: { model_alias = "qwen3-0.6b", operation = "chat" }
public_routes = []

[[adapters]]
id = "ollama-mac"
kind = "ollama"
# Needs deploy/compose/compose.kanata.host-ollama.yml on macOS/OrbStack.
base_url = "http://host.orb.internal:11434/v1"
trust_zone = "local"
[adapters.capabilities]
operations = ["chat"]
streaming_chat = true
function_tools = false

[[routes]]
id = "ollama-qwen3-0-6b"
model_alias = "qwen3-0.6b"
operation = "chat"
adapter_id = "ollama-mac"
upstream_id = "qwen3:0.6b"
requires_streaming_chat = true
requires_function_tools = false

# Application keys live in a machine-managed file (paths are relative to this
# file). Create the owner key with the host CLI:
# `kanata key new --config <this file> --owner --id owner --chat <alias>... --expires <days>`
[keys]
file = "keys/keys.toml"
usage_dir = "state"

# Keys for other people: non-owner, scoped to public-eligible models only.
# A key works publicly only for aliases in both its permissions and public_routes:
# `kanata key new --config <this file> --id alice --chat qwen3-0.6b --expires 30`.

# Container logs (docker compose logs kanata). level: trace|debug|info|warn|error;
# format: text|json. debug adds sanitized provider error messages.
[logging]
level = "info"
format = "text"

[limits]
# Shared request payload reservations per process; includes queued requests.
max_uploads = 8
max_buffered_bytes = 268435456
max_queue = 32
max_in_flight = 8
max_body_bytes = 1048576
max_audio_bytes = 26214400
max_extension_bytes = 8192

[timeouts]
upload_ms = 30000
queue_ms = 1000
connect_ms = 5000
headers_ms = 120000
first_byte_ms = 120000
idle_ms = 120000
overall_ms = 900000
