# Native Ollama vision gateway. Verify the installed model supports images first.
[listeners.client]
bind = "127.0.0.1"
port = 8080

[listeners.admin]
bind = "127.0.0.1"
port = 9090

[publication]
tailnet_addresses = ["100.64.0.10"]

[[adapters]]
id = "ollama-vision"
kind = "ollama"
base_url = "http://127.0.0.1:11434/v1"
trust_zone = "local"
[adapters.capabilities]
operations = ["chat"]
streaming_chat = true
function_tools = false
input_images = true

[[routes]]
id = "local-vision-chat"
model_alias = "local-vision"
operation = "chat"
adapter_id = "ollama-vision"
upstream_id = "replace-with-installed-vision-model"
requires_streaming_chat = true
requires_function_tools = false
allows_input_images = true

# kanata key new --config <path> --id vision-client --chat local-vision --expires 30
[keys]
file = "keys/keys.toml"
usage_dir = "state"

[limits]
max_uploads = 4
max_buffered_bytes = 268435456
max_queue = 8
max_in_flight = 2
max_body_bytes = 16777216
max_audio_bytes = 1048576
max_extension_bytes = 8192

[timeouts]
upload_ms = 30000
queue_ms = 1000
connect_ms = 5000
headers_ms = 10000
first_byte_ms = 15000
idle_ms = 30000
overall_ms = 60000
