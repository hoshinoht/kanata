# Private container template: copy to config/config.toml (git-ignored) and
# replace the tailnet address. Reached only by your reverse proxy on
# kanata_private_ingress; Kanata has no host ports.
[listeners.client]
bind = "172.30.0.2"
port = 8080

[listeners.admin]
bind = "127.0.0.1"
port = 9090

[publication]
# Host tailnet IPv4; must match the edge's EDGE_TAILNET_IPV4.
tailnet_addresses = ["100.64.0.10"]

[[adapters]]
id = "ollama-mac"
kind = "ollama"
# Needs deploy/compose/compose.kanata.host-ollama.yml on macOS/OrbStack.
base_url = "http://host.orb.internal:11434/v1"
trust_zone = "local"
# Optional cap shared by every route on this adapter, e.g. 1 for a single local GPU.
# max_in_flight = 1
# On by default: after 5 connection failures in a row, fail fast for 30 s, then probe.
# circuit_breaker = { enabled = true, failures = 5, cooldown_ms = 30000 }
[adapters.capabilities]
operations = ["chat"]
streaming_chat = true
function_tools = false

# Apple Foundation Models (macOS 27+): `deploy/scripts/kanata.sh fm-serve install`, then
# uncomment this adapter and the matching route below.
# [[adapters]]
# id = "apple-fm"
# kind = "apple_fm"
# base_url = "http://host.orb.internal:1976/v1"
# trust_zone = "local"
# [adapters.capabilities]
# operations = ["chat"]
# streaming_chat = true
# function_tools = false
# structured_output = true
# sampling_controls = true

# CLIProxyAPI through deploy/compose/compose.kanata.cliproxy.yml (see deploy/docker/README.md).
# Private-only like ChatGPT/Anthropic: never list its routes in public_routes.
# [[adapters]]
# id = "cliproxy"
# kind = "cliproxy"
# base_url = "https://cliproxy-tls:8443/v1"
# ca_file = "/run/secrets/cliproxy-ca.pem"
# secret_ref = "file:/run/secrets/cliproxy-api-key"
# trust_zone = "external"
# [adapters.capabilities]
# operations = ["chat"]
# streaming_chat = true
# function_tools = true
# reasoning_control = true

# ChatGPT plan models: add the adapter, [chatgpt_auth] and routes from
# chatgpt.example.toml together with deploy/compose/compose.kanata.chatgpt.yml.

# Aliases may not contain ':' except an effort suffix, so dash the Ollama tag.
[[routes]]
id = "ollama-qwen3-0-6b"
model_alias = "qwen3-0.6b"
operation = "chat"
adapter_id = "ollama-mac"
upstream_id = "qwen3:0.6b"
# Declared window shown on /v1/models; must match the Ollama model
# (see `deploy/scripts/kanata.sh ollama-context`). Omit for cloud models.
# context_tokens = 16384
# Largest max_tokens a client may request; shown on /v1/models.
# max_output_tokens = 4096
requires_streaming_chat = true
requires_function_tools = false

# [[routes]]
# id = "apple-fm-system"
# model_alias = "apple-fm"
# operation = "chat"
# adapter_id = "apple-fm"
# upstream_id = "system"
# context_tokens = 8192
# requires_streaming_chat = true
# requires_function_tools = false

# Application keys live in a machine-managed file (paths are relative to this
# file). Create the owner key with the host CLI:
# `kanata key new --config <this file> --owner --id owner --chat <alias>... --expires <days>`
[keys]
file = "keys/keys.toml"
usage_dir = "state"

# Container logs (docker compose logs kanata). level: trace|debug|info|warn|error;
# format: text|json. debug adds sanitized provider error messages.
[logging]
level = "info"
format = "text"

[limits]
# Shared request payload reservations per process; includes queued requests.
max_uploads = 8
max_buffered_bytes = 268435456
max_queue = 32
max_in_flight = 8
max_body_bytes = 1048576
max_audio_bytes = 26214400
max_extension_bytes = 8192

# Long enough for high-effort reasoning turns.
[timeouts]
# Optional SSE keepalive interval in milliseconds (default 15000, capped by overall_ms).
# sse_keepalive_ms = 15000
upload_ms = 30000
queue_ms = 1000
connect_ms = 5000
headers_ms = 120000
first_byte_ms = 120000
idle_ms = 120000
overall_ms = 900000
