# TLS sidecar: terminates Kanata's HTTPS and forwards to the `cliproxy` service
# over the internal cliproxy_upstream network (compose.kanata.cliproxy.yml).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64m;

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.3;

        location / {
            proxy_pass http://cliproxy:8317;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Streams (SSE) pass through unbuffered.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
